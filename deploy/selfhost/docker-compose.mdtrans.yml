# Настройки «Грузоперевозок» поверх официальной сборки Supabase. Подключается
# установщиком последним в COMPOSE_FILE (после docker-compose.caddy.yml), см.
# lib.sh → apply_config.

services:
  # Шлюз API — только для самого сервера: скрипты установки и вход в панель
  # Studio через SSH-туннель. Снаружи всё идёт через Caddy по HTTPS.
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000/tcp"

  # Пулер соединений с базой наружу не открываем: приложениям он не нужен,
  # а открытый порт базы в интернет — лишний риск.
  supavisor:
    ports: !reset []

  # API помнит уже проверенные токены входа — по умолчанию 1000, а
  # сотрудников в сервисе тысячи: без запаса он проверял бы токен заново
  # почти на каждый запрос. На нагрузочном тесте у предела нагрузки
  # задержки с запасом были примерно вдвое ниже.
  rest:
    environment:
      PGRST_JWT_CACHE_MAX_ENTRIES: "10000"

  # Ограничение числа попыток входа — по IP клиента. Без этой настройки
  # Supabase Auth не видит настоящий IP (все запросы приходят от Caddy) и
  # подбор пароля ничем не ограничен. Caddy сам ставит настоящий IP в
  # X-Forwarded-For и подделанный клиентом заголовок не пропускает.
  auth:
    environment:
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
